name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: Build & test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Swift version
        run: swift --version

      - name: Build (all targets)
        run: swift build

      - name: Run tests
        run: swift run EspressoTests

      # Release compiles different code than debug (#if ESPRESSO_DEVTOOLS strips
      # the dev CLI modes), so build and test both configurations.
      - name: Build (release)
        run: swift build -c release

      - name: Run tests (release)
        run: swift run -c release EspressoTests

      # Espresso is Apple Silicon-only. Assemble the real bundle (exercising the
      # Info.plist + codesign path) and assert the shipped executable is EXACTLY
      # arm64 — an arm64-only slice is what makes the app unlaunchable on Intel.
      - name: Build Espresso.app (arm64-only)
        run: scripts/build_app.sh

      - name: Verify Apple Silicon-only artifact
        run: |
          ARCHS="$(lipo -archs Espresso.app/Contents/MacOS/Espresso)"
          echo "slices: $ARCHS"
          test "$ARCHS" = "arm64"
